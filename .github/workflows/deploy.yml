name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Flutter build ──────────────────────────────────────────────────────
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Flutter web
        working-directory: flutter
        run: |
          flutter pub get
          flutter build web --release
          # Use relative base-href so the app works at any served path
          sed -i 's|<base href="/">|<base href="./">|g' build/web/index.html

      # ── Godot web export ───────────────────────────────────────────────────
      # Export the Godot build from source on every deploy so it can't drift
      # behind the committed scripts (the cause of the Tech Tree being missing
      # from the deployed build). Pinned to 4.3-stable to match project.godot.
      - name: Install Godot 4.3 + export templates
        run: |
          GODOT=4.3-stable
          wget -qO /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT}/Godot_v${GODOT}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          sudo mv "/tmp/Godot_v${GODOT}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          wget -qO /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT}/Godot_v${GODOT}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          mv /tmp/tpl/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Build Godot web
        working-directory: godot
        run: |
          mkdir -p build/web
          # First headless run imports resources (.godot cache); its recoverable
          # warnings are non-fatal, so export on the second run.
          godot --headless --import 2>&1 || true
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.pck  # fail the build if the export didn't produce a pck

      # ── Assemble deploy folder ─────────────────────────────────────────────
      # Structure served by GitHub Pages:
      #   /                        → landing page
      #   /js/                     → JS game
      #   /flutter/build/web/      → Flutter web build (relative base-href)
      #   /godot/build/web/        → Godot web export (built above, no-threads)
      - name: Assemble site
        run: |
          mkdir -p _site/js _site/flutter/build/web _site/godot/build/web _site/assets
          cp index.html _site/
          cp README.md  _site/
          cp -r assets/. _site/assets/
          cp -r js/. _site/js/
          cp -r flutter/build/web/. _site/flutter/build/web/
          cp -r godot/build/web/. _site/godot/build/web/

      # ── Upload artifact for GitHub Pages ───────────────────────────────────
      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
